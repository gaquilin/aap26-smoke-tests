---
controller_templates:
  - name: "SMOKE-REG-TEST-Job-Template"
    description: "Job template for AAP 2.6 smoke regression testing"
    organization: "SMOKE-REG-TEST-Organization"
    project: "SMOKE-REG-TEST-Project"
    playbook: "{{ smoke_jt_playbook }}"
    inventory: "SMOKE-REG-TEST-Inventory"
    execution_environment: "SMOKE-REG-TEST-EE"
{% if smoke_jt_credentials | default([]) | length > 0 %}
    credentials: {{ smoke_jt_credentials | to_json }}
{% endif %}
    job_type: "run"
    job_slice_count: 1
    ask_job_slice_count_on_launch: true
    extra_vars:
      smoke_test_var: "Hello from AAP 2.6 Smoke Test"
    allow_simultaneous: true
    state: present
