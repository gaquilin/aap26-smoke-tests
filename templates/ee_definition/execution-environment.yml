# =============================================================================
# Minimal Execution Environment Definition for ansible-builder
# Used by Build Custom Execution Environment test
#
# This is a minimal EE for smoke testing purposes.
# Base image: UBI9 (publicly available, no auth required)
# =============================================================================
---
version: 3

dependencies:
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml
  system: bindep.txt

images:
  base_image:
    name: registry.access.redhat.com/ubi9/ubi:latest

additional_build_steps:
  prepend_final: |
    RUN whoami
    RUN cat /etc/os-release
  append_final:
    - RUN echo "Smoke Test EE build completed successfully!"
