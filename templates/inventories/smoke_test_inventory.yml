---
controller_inventories:
  - name: "SMOKE-REG-TEST-Inventory"
    description: "Inventory for AAP 2.6 smoke regression testing"
    organization: "SMOKE-REG-TEST-Organization"
    state: present

controller_hosts:
{% for host in smoke_inventory_hosts %}
  - name: "{{ host.name }}"
    inventory: "SMOKE-REG-TEST-Inventory"
    variables:
      ansible_host: "{{ host.ansible_host | default(host.name) }}"
      ansible_connection: "{{ host.ansible_connection | default('local') }}"
    state: present
{% endfor %}
