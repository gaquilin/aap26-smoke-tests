# =============================================================================
# Template: Credential from Custom Credential Type for AAP 2.6 Smoke Test
# Role: infra.aap_configuration.controller_credentials
# Expected variable: controller_credentials
# Prerequisite: Credential Type "Smoke Test Credential Type" already created
# =============================================================================
---
controller_credentials:
  - name: "Smoke Test Custom Credential"
    description: "Credential from custom type for AAP 2.6 smoke testing"
    organization: "Smoke_Test_Organization"
    credential_type: "Smoke Test Credential Type"
    inputs:
      smoke_api_url: "https://api.example.com/v1"
      smoke_api_token: "CHANGEME_SMOKE_TEST_TOKEN"
    state: present
