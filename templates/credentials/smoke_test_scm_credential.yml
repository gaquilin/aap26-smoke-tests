# =============================================================================
# Template: Source Control Credential for AAP 2.6 Smoke Test
# Role: infra.aap_configuration.controller_credentials
# Expected variable: controller_credentials
# =============================================================================
---
controller_credentials:
  - name: "Smoke Test - GitHub SCM Credential"
    description: "Source Control credential for AAP 2.6 smoke testing"
    organization: "Smoke_Test_Organization"
    credential_type: "Source Control"
    inputs:
      username: "{{ scm_username }}"
      password: "{{ scm_password }}"
    state: present
