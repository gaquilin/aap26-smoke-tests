---
controller_credential_types:
  - name: "Smoke Test Credential Type"
    description: "Custom credential type created for AAP 2.6 smoke testing"
    kind: "cloud"
    inputs:
      fields:
        - id: smoke_api_url
          type: string
          label: "API URL"
        - id: smoke_api_token
          type: string
          label: "API Token"
          secret: true
      required:
        - smoke_api_url
        - smoke_api_token
    injectors:
      extra_vars:
        smoke_api_url: "{% raw %}{{ smoke_api_url }}{% endraw %}"
        smoke_api_token: "{% raw %}{{ smoke_api_token }}{% endraw %}"
    state: present
