---
- name: "Create Credential Type"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
  vars:
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"

  tasks:
    - name: "Obtain OAuth token (standalone mode)"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/tokens/"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: POST
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 201
      register: _authtoken_res
      no_log: true
      when: controller_oauthtoken is not defined

    - name: "Set OAuth token (standalone mode)"
      ansible.builtin.set_fact:
        controller_oauthtoken: "{{ _authtoken_res.json.token }}"
      when: _authtoken_res is not skipped
      no_log: true

    - name: "Find credential type templates (standalone mode)"
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../templates/credential_types/"
        patterns: "*.yml,*.yaml"
      register: _template_files
      when: smoke_credential_types is not defined

    - name: "Load credential type templates (standalone mode)"
      ansible.builtin.set_fact:
        smoke_credential_types: >-
          {{ smoke_credential_types | default([]) +
             ((lookup('template', item.path) | from_yaml).controller_credential_types | default([])) }}
      loop: "{{ _template_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: _template_files is not skipped

    - name: "Set credential type data"
      ansible.builtin.set_fact:
        _credential_types: "{{ smoke_credential_types | default([]) }}"

    - name: "Create Credential Types"
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_credential_types
      vars:
        controller_credential_types: "{{ _credential_types }}"
        aap_token: "{{ controller_oauthtoken }}"

    - name: "Verify Credential Type creation"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/credential_types/?search={{ item.name | urlencode }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      loop: "{{ _credential_types }}"
      loop_control:
        label: "{{ item.name }}"
      register: credtype_verify

    - name: "Set report status"
      ansible.builtin.set_fact:
        _overall_status: "{{ 'PASSED' if credtype_verify.results | rejectattr('failed', 'false') | list | length == 0 else 'FAILED' }}"
        _status_icon: "{{ '✅' if credtype_verify.results | rejectattr('failed', 'false') | list | length == 0 else '❌' }}"

    - name: "Save report"
      ansible.builtin.copy:
        content: |
          # Create Credential Type

          **Date:** {{ ansible_date_time.iso8601 }}
          **Result:** {{ _status_icon }} {{ _overall_status }}

          ## Resources Created

          {% for ct in _credential_types %}
          ### Credential Type: {{ ct.name }}

          | Field | Value |
          |---|---|
          | **Resource Type** | Credential Type |
          | **Name** | {{ ct.name }} |
          | **Description** | {{ ct.description | default('N/A') }} |
          | **Kind** | {{ ct.kind | default('N/A') }} |
          | **Input Fields** | {{ ct.inputs.fields | map(attribute='id') | join(', ') }} |
          | **State** | {{ ct.state | default('present') }} |

          {% endfor %}
          ## Verification

          | Credential Type | Found on AAP |
          |---|---|
          {% for result in credtype_verify.results %}
          | {{ result.item.name }} | {{ '✅ Yes' if result.json.count | int > 0 else '❌ No' }} |
          {% endfor %}
        dest: "{{ reports_dir }}/08_create_credential_type_report.md"
        mode: '0644'

    - name: "Display test result"
      ansible.builtin.debug:
        msg: "Create Credential Type: {{ _overall_status }}"

    - name: "Assert Credential Types created"
      ansible.builtin.assert:
        that:
          - item.json.count | int > 0
        fail_msg: "Credential Type '{{ item.item.name }}' not found"
        success_msg: "Credential Type '{{ item.item.name }}' created successfully"
      loop: "{{ credtype_verify.results }}"
      loop_control:
        label: "{{ item.item.name }}"
