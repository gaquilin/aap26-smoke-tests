---
- name: "AAP 2.6 Smoke Test - Data Processing"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
    - ../vars/main.yml
  vars:
    templates_dir: "{{ playbook_dir }}/../templates"
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"

  tasks:
    - name: "Ensure reports directory exists"
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: '0755'

    - name: "Scan template files"
      ansible.builtin.find:
        paths: "{{ templates_dir }}"
        patterns: "*.yml,*.yaml"
        excludes: "ee_definition"
        recurse: true
      register: template_files_raw

    - name: "Filter out ee_definition files"
      ansible.builtin.set_fact:
        template_files:
          files: "{{ template_files_raw.files | rejectattr('path', 'search', 'ee_definition') | list }}"

    - name: "Display discovered templates"
      ansible.builtin.debug:
        msg: "Found {{ template_files.files | length }} template files: {{ template_files.files | map(attribute='path') | map('basename') | list }}"

    - name: "Load all template data into all_yaml_data"
      ansible.builtin.set_fact:
        all_yaml_data: >-
          {{
            all_yaml_data | default([]) +
            [{
              'path': item.path,
              'content': lookup('template', item.path) | from_yaml
            }]
          }}
      loop: "{{ template_files.files }}"
      loop_control:
        label: "Loading: {{ item.path | basename }}"

    - name: "Extract and map resources from template data"
      ansible.builtin.set_fact:
        smoke_execution_environments: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'execution_environments')
            | map(attribute='content.controller_execution_environments')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_organizations: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'organizations')
            | map(attribute='content.controller_organizations')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_projects: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'projects')
            | map(attribute='content.controller_projects')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_inventories: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'inventories')
            | map(attribute='content.controller_inventories')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_hosts: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'inventories')
            | map(attribute='content.controller_hosts')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_job_templates: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'job_templates')
            | map(attribute='content.controller_templates')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_workflows: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'workflow_job_templates')
            | map(attribute='content.controller_workflows')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}

    - name: "Display extracted resource summary"
      ansible.builtin.debug:
        msg:
          - "=== AAP 2.6 Smoke Test - Resource Summary ==="
          - "Execution Environments: {{ smoke_execution_environments | length }}"
          - "Organizations:          {{ smoke_organizations | length }}"
          - "Projects:               {{ smoke_projects | length }}"
          - "Inventories:            {{ smoke_inventories | length }}"
          - "Hosts:                  {{ smoke_hosts | length }}"
          - "Job Templates:          {{ smoke_job_templates | length }}"
          - "Workflow Templates:     {{ smoke_workflows | length }}"

    - name: "Register data processing result"
      ansible.builtin.set_fact:
        smoke_test_results: >-
          {{ smoke_test_results | default({}) | combine({
            'data_processing': {
              'name': 'Data Processing',
              'status': 'PASSED',
              'details': (template_files.files | length | string) ~ ' templates loaded',
              'resources': [
                {'type': 'Execution Environments', 'count': smoke_execution_environments | length},
                {'type': 'Organizations', 'count': smoke_organizations | length},
                {'type': 'Projects', 'count': smoke_projects | length},
                {'type': 'Inventories', 'count': smoke_inventories | length},
                {'type': 'Hosts', 'count': smoke_hosts | length},
                {'type': 'Job Templates', 'count': smoke_job_templates | length},
                {'type': 'Workflow Templates', 'count': smoke_workflows | length}
              ]
            }
          }) }}

- import_playbook: 01_platform_availability.yml
  when: run_platform_availability | default(true) | bool

- import_playbook: 02_iam_access_validation.yml
  when: run_iam_access_validation | default(true) | bool

- import_playbook: 03_push_ee_to_hub.yml
  when: run_push_ee_to_hub | default(true) | bool

- import_playbook: 04_register_ee.yml
  when: run_register_ee | default(true) | bool

- import_playbook: 05_create_organization.yml
  when: run_create_organization | default(true) | bool

- import_playbook: 07_project_sync.yml
  when: run_project_sync | default(true) | bool

- import_playbook: 10_create_inventory.yml
  when: run_create_inventory | default(true) | bool

- import_playbook: 11_create_job_template.yml
  when: run_create_job_template | default(true) | bool

- import_playbook: 12_launch_job_template.yml
  when: run_launch_job_template | default(true) | bool

- import_playbook: 13_create_workflow_template.yml
  when: run_create_workflow_template | default(true) | bool

- import_playbook: 14_launch_workflow_template.yml
  when: run_launch_workflow_template | default(true) | bool

- import_playbook: 99_cleanup.yml
  when: run_cleanup | default(true) | bool

- name: "Generate Smoke Test Report"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
    - ../vars/main.yml
  vars:
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"
  tasks:
    - name: "Ensure reports directory exists"
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: '0755'

    - name: "Generate HTML report"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/reports/smoke_test_report.html.j2"
        dest: "{{ reports_dir }}/smoke_test_report.html"
        mode: '0644'

    - name: "Display report location"
      ansible.builtin.debug:
        msg: "Report generated: {{ reports_dir }}/smoke_test_report.html"

    - name: "Send report via email"
      community.general.mail:
        host: "{{ smoke_report_smtp_host }}"
        port: "{{ smoke_report_smtp_port }}"
        from: "{{ smoke_report_email_from }}"
        to: "{{ smoke_report_email_to }}"
        subject: "{{ smoke_report_email_subject }} - {{ ansible_date_time.date }}"
        subtype: html
        body: "{{ lookup('file', reports_dir ~ '/smoke_test_report.html') }}"
      when: smoke_report_email_enabled | default(false) | bool
