---
- name: "AAP 2.6 Smoke Test - Data Processing"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
  vars:
    templates_dir: "{{ playbook_dir }}/../templates"
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"

  tasks:
    - name: "Ensure reports directory exists"
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: '0755'

    - name: "Obtain OAuth token from AAP 2.6"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/tokens/"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: POST
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 201
      register: _authtoken_res
      no_log: true

    - name: "Set OAuth token facts"
      ansible.builtin.set_fact:
        controller_oauthtoken: "{{ _authtoken_res.json.token }}"
        controller_oauthtoken_url: "{{ _authtoken_res.json.url }}"

    - name: "Scan template files"
      ansible.builtin.find:
        paths: "{{ templates_dir }}"
        patterns: "*.yml,*.yaml"
        excludes: "ee_definition"
        recurse: true
      register: template_files_raw

    - name: "Filter out ee_definition files"
      ansible.builtin.set_fact:
        template_files:
          files: "{{ template_files_raw.files | rejectattr('path', 'search', 'ee_definition') | list }}"

    - name: "Display discovered templates"
      ansible.builtin.debug:
        msg: "Found {{ template_files.files | length }} template files: {{ template_files.files | map(attribute='path') | map('basename') | list }}"

    - name: "Load all template data into all_yaml_data"
      ansible.builtin.set_fact:
        all_yaml_data: >-
          {{
            all_yaml_data | default([]) +
            [{
              'path': item.path,
              'content': lookup('template', item.path) | from_yaml
            }]
          }}
      loop: "{{ template_files.files }}"
      loop_control:
        label: "Loading: {{ item.path | basename }}"

    - name: "Extract and map resources from template data"
      ansible.builtin.set_fact:
        smoke_execution_environments: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'execution_environments')
            | map(attribute='content.controller_execution_environments')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_organizations: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'organizations')
            | map(attribute='content.controller_organizations')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_credential_types: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'credential_types')
            | map(attribute='content.controller_credential_types')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_credentials: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'credentials/')
            | map(attribute='content.controller_credentials')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_projects: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'projects')
            | map(attribute='content.controller_projects')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_inventories: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'inventories')
            | map(attribute='content.controller_inventories')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_inventory_sources: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'inventories')
            | map(attribute='content.controller_inventory_sources')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_hosts: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'inventories')
            | map(attribute='content.controller_hosts')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_job_templates: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'job_templates')
            | map(attribute='content.controller_templates')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}
        smoke_workflows: >-
          {{
            all_yaml_data
            | selectattr('path', 'search', 'workflow_job_templates')
            | map(attribute='content.controller_workflows')
            | select('defined')
            | reject('none')
            | flatten
            | list
          }}

    - name: "Display extracted resource summary"
      ansible.builtin.debug:
        msg:
          - "=== AAP 2.6 Smoke Test - Resource Summary ==="
          - "Execution Environments: {{ smoke_execution_environments | length }}"
          - "Organizations:          {{ smoke_organizations | length }}"
          - "Credential Types:       {{ smoke_credential_types | length }}"
          - "Credentials:            {{ smoke_credentials | length }}"
          - "Projects:               {{ smoke_projects | length }}"
          - "Inventories:            {{ smoke_inventories | length }}"
          - "Inventory Sources:      {{ smoke_inventory_sources | length }}"
          - "Hosts:                  {{ smoke_hosts | length }}"
          - "Job Templates:          {{ smoke_job_templates | length }}"
          - "Workflow Templates:     {{ smoke_workflows | length }}"

    - name: "Save Data Processing report"
      ansible.builtin.copy:
        content: |
          # Data Processing

          **Date:** {{ ansible_date_time.iso8601 }}
          **Result:** ✅ COMPLETED

          ## Templates Loaded

          {{ template_files.files | length }} template files loaded from `templates/` directory.

          ## Resources Extracted

          | Resource Type | Count |
          |---|---|
          | Execution Environments | {{ smoke_execution_environments | length }} |
          | Organizations | {{ smoke_organizations | length }} |
          | Credential Types | {{ smoke_credential_types | length }} |
          | Credentials | {{ smoke_credentials | length }} |
          | Projects | {{ smoke_projects | length }} |
          | Inventories | {{ smoke_inventories | length }} |
          | Inventory Sources | {{ smoke_inventory_sources | length }} |
          | Hosts | {{ smoke_hosts | length }} |
          | Job Templates | {{ smoke_job_templates | length }} |
          | Workflow Templates | {{ smoke_workflows | length }} |
        dest: "{{ reports_dir }}/00_data_processing_report.md"
        mode: '0644'

- import_playbook: 01_platform_availability.yml

- import_playbook: 02_build_custom_ee.yml

- import_playbook: 03_push_ee_to_hub.yml

- import_playbook: 04_register_ee.yml

- import_playbook: 05_create_organization.yml

- import_playbook: 08_create_credential_type.yml

- import_playbook: 06_create_credentials.yml

- import_playbook: 07_project_sync.yml

- import_playbook: 10_create_inventory.yml

- import_playbook: 11_create_job_template.yml

- import_playbook: 12_launch_job_template.yml

- import_playbook: 13_create_workflow_template.yml

- import_playbook: 14_launch_workflow_template.yml
