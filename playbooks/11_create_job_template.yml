---
- name: "Create Job Template"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
    - ../vars/main.yml
  vars:
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"

  tasks:
    - name: "Obtain OAuth token"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/tokens/"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: POST
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 201
      register: _authtoken_res
      no_log: true

    - name: "Set OAuth token"
      ansible.builtin.set_fact:
        controller_oauthtoken: "{{ _authtoken_res.json.token }}"
        controller_oauthtoken_url: "{{ _authtoken_res.json.url }}"
      no_log: true

    - name: "Find job template files (standalone mode)"
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../templates/job_templates/"
        patterns: "*.yml,*.yaml"
      register: _template_files
      when: smoke_job_templates is not defined

    - name: "Load job templates (standalone mode)"
      ansible.builtin.set_fact:
        smoke_job_templates: >-
          {{ smoke_job_templates | default([]) +
             ((lookup('template', item.path) | from_yaml).controller_templates | default([])) }}
      loop: "{{ _template_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: _template_files is not skipped

    - name: "Set job template data"
      ansible.builtin.set_fact:
        _templates: "{{ smoke_job_templates | default([]) }}"

    - name: "Create Job Templates"
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_job_templates
      vars:
        controller_templates: "{{ _templates }}"
        aap_token: "{{ controller_oauthtoken }}"

    - name: "Verify Job Template creation"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/job_templates/?search={{ item.name | urlencode }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      loop: "{{ _templates }}"
      loop_control:
        label: "{{ item.name }}"
      register: jt_verify

    - name: "Set report status"
      ansible.builtin.set_fact:
        _overall_status: "{{ 'PASSED' if jt_verify.results | rejectattr('failed', 'false') | list | length == 0 else 'FAILED' }}"
        _status_icon: "{{ '✅' if jt_verify.results | rejectattr('failed', 'false') | list | length == 0 else '❌' }}"

    - name: "Register test result"
      ansible.builtin.set_fact:
        smoke_test_results: >-
          {{ smoke_test_results | default({}) | combine({
            'create_job_template': {
              'name': 'Create Job Template',
              'status': _overall_status,
              'details': 'Job Template "' ~ (_templates | map(attribute='name') | join('", "')) ~ '" has been created successfully on Automation Controller'
              if _overall_status == 'PASSED'
              else 'Failed to create Job Template(s) on Automation Controller'
            }
          }) }}

    - name: "Display test result"
      ansible.builtin.debug:
        msg: "Create Job Template: {{ _overall_status }}"

    - name: "Assert Job Templates created"
      ansible.builtin.assert:
        that:
          - item.json.count | int > 0
        fail_msg: "Job Template '{{ item.item.name }}' not found"
        success_msg: "Job Template '{{ item.item.name }}' created successfully"
      loop: "{{ jt_verify.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "Delete OAuth token"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ controller_oauthtoken_url }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: DELETE
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 204
      when: controller_oauthtoken_url is defined
