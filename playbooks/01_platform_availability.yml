# =============================================================================
# Platform Availability and Login
# =============================================================================
# Objective: Verify connectivity to the Gateway URL and that each AAP 2.6
#            component endpoint responds correctly.
#
# Endpoints verified:
#   - Gateway:                /api/gateway/v1/ping/
#   - Controller:             /api/controller/v2/ping/
#   - Private Automation Hub: /api/galaxy/pulp/api/v3/status/
#   - EDA:                    /api/eda/v1/status/
#
# Expected output: Each endpoint returns HTTP 200.
# =============================================================================
---
- name: "Platform Availability and Login"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
  vars:
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"
    aap_endpoints:
      - name: "Gateway"
        path: "/api/gateway/v1/ping/"
      - name: "Controller"
        path: "/api/controller/v2/ping/"
      - name: "Private Automation Hub"
        path: "/api/galaxy/pulp/api/v3/status/"
      - name: "Event-Driven Ansible (EDA)"
        path: "/api/eda/v1/status/"

  tasks:
    # -----------------------------------------------------------------
    # Verify connectivity to each endpoint
    # -----------------------------------------------------------------
    - name: "Ping AAP endpoints"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ item.path }}"
        method: GET
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200]
        return_content: true
        timeout: 30
      loop: "{{ aap_endpoints }}"
      loop_control:
        label: "{{ item.name }}"
      register: ping_results
      ignore_errors: true

    # -----------------------------------------------------------------
    # Verify Gateway authentication
    # -----------------------------------------------------------------
    - name: "Verify Gateway authentication"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/gateway/v1/me/"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200]
        return_content: true
      register: auth_result
      ignore_errors: true

    # -----------------------------------------------------------------
    # Verify Controller Instances
    # -----------------------------------------------------------------
    - name: "Verify Controller Instances"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/instances/"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200]
        return_content: true
      register: instances_result
      ignore_errors: true

    # -----------------------------------------------------------------
    # Report generation
    # -----------------------------------------------------------------
    - name: "Build report data"
      ansible.builtin.set_fact:
        _overall_status: >-
          {{ 'PASSED' if (ping_results.results | rejectattr('failed', 'false') | list | length == 0)
             and (auth_result is success)
             and (instances_result is success)
             else 'FAILED' }}
        _status_icon: >-
          {{ '✅' if (ping_results.results | rejectattr('failed', 'false') | list | length == 0)
             and (auth_result is success)
             and (instances_result is success)
             else '❌' }}

    - name: "Save report"
      ansible.builtin.copy:
        content: |
          # Platform Availability and Login

          **Date:** {{ ansible_date_time.iso8601 }}
          **Result:** {{ _status_icon }} {{ _overall_status }}

          ## Endpoint Results

          | Endpoint | Status |
          |---|---|
          {% for result in ping_results.results %}
          | {{ result.item.name }} | HTTP {{ result.status | default('N/A') }} |
          {% endfor %}

          ## Details

          | Check | Result |
          |---|---|
          | Authentication | {{ 'PASSED' if auth_result is success else 'FAILED' }} |
          | Instances Count | {{ (instances_result.json.count | default(0)) if instances_result is success else 0 }} |
          | AAP Hostname | {{ aap_hostname }} |
        dest: "{{ reports_dir }}/01_platform_availability_report.md"
        mode: '0644'

    - name: "Display test result"
      ansible.builtin.debug:
        msg: >-
          Platform Availability: {{ _overall_status }}
          | Endpoints OK: {{ ping_results.results | selectattr('status', 'equalto', 200) | list | length }}/{{ aap_endpoints | length }}
          | Auth: {{ 'PASSED' if auth_result is success else 'FAILED' }}
          | Instances: {{ (instances_result.json.count | default(0)) if instances_result is success else 0 }}

    - name: "Assert all endpoints are reachable"
      ansible.builtin.assert:
        that:
          - ping_results.results | selectattr('failed') | list | length == 0
          - auth_result is success
          - instances_result is success
        fail_msg: "One or more AAP 2.6 endpoints are not reachable or authentication failed"
        success_msg: "All AAP 2.6 endpoints are reachable and authentication successful"
