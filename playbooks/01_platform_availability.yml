---
- name: "Platform Availability and Login"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
  vars:
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"
    aap_endpoints:
      - name: "Gateway"
        path: "/api/gateway/v1/ping/"
      - name: "Controller"
        path: "/api/controller/v2/ping/"
      - name: "Private Automation Hub"
        path: "/api/galaxy/pulp/api/v3/status/"
      - name: "Event-Driven Ansible (EDA)"
        path: "/api/eda/v1/status/"

  tasks:
    - name: "Ping AAP endpoints"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ item.path }}"
        method: GET
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200]
        return_content: true
        timeout: 30
      loop: "{{ aap_endpoints }}"
      loop_control:
        label: "{{ item.name }}"
      register: ping_results
      ignore_errors: true

    - name: "Verify Gateway authentication"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/gateway/v1/me/"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200]
        return_content: true
      register: auth_result
      ignore_errors: true

    - name: "Verify Controller Instances"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/instances/"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200]
        return_content: true
      register: instances_result
      ignore_errors: true

    - name: "Build report data"
      ansible.builtin.set_fact:
        _overall_status: >-
          {{ 'PASSED' if (ping_results.results | rejectattr('failed', 'false') | list | length == 0)
             and (auth_result is success)
             and (instances_result is success)
             else 'FAILED' }}
        _status_icon: >-
          {{ '✅' if (ping_results.results | rejectattr('failed', 'false') | list | length == 0)
             and (auth_result is success)
             and (instances_result is success)
             else '❌' }}

    - name: "Register test result"
      ansible.builtin.set_fact:
        smoke_test_results: >-
          {{ smoke_test_results | default({}) | combine({
            'platform_availability': {
              'name': 'Platform Availability',
              'status': _overall_status,
              'details': 'All AAP 2.6 platform endpoints (Gateway, Controller, Hub, EDA) are reachable and authentication is successful — ' ~ (ping_results.results | selectattr('status', 'equalto', 200) | list | length | string) ~ '/' ~ (aap_endpoints | length | string) ~ ' endpoints responding'
              if _overall_status == 'PASSED'
              else 'Platform availability check failed — ' ~ (ping_results.results | selectattr('status', 'equalto', 200) | list | length | string) ~ '/' ~ (aap_endpoints | length | string) ~ ' endpoints responding, Auth: ' ~ ('OK' if auth_result is success else 'FAILED')
            }
          }) }}

    - name: "Display test result"
      ansible.builtin.debug:
        msg: >-
          Platform Availability: {{ _overall_status }}
          | Endpoints OK: {{ ping_results.results | selectattr('status', 'equalto', 200) | list | length }}/{{ aap_endpoints | length }}
          | Auth: {{ 'PASSED' if auth_result is success else 'FAILED' }}
          | Instances: {{ (instances_result.json.count | default(0)) if instances_result is success else 0 }}

    - name: "Assert all endpoints are reachable"
      ansible.builtin.assert:
        that:
          - ping_results.results | selectattr('failed') | list | length == 0
          - auth_result is success
          - instances_result is success
        fail_msg: "One or more AAP 2.6 endpoints are not reachable or authentication failed"
        success_msg: "All AAP 2.6 endpoints are reachable and authentication successful"
