---
- name: "Launch and Verify Workflow Job Template"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
  vars:
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"
    workflow_template_name: "SMOKE-REG-TEST-Workflow"
    workflow_wait_timeout: 300
    workflow_wait_interval: 10

  tasks:
    - name: "Get Workflow Job Template details"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/workflow_job_templates/?search={{ workflow_template_name | urlencode }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      register: wf_lookup

    - name: "Assert Workflow Template exists"
      ansible.builtin.assert:
        that:
          - wf_lookup.json.count | int > 0
        fail_msg: "Workflow Template '{{ workflow_template_name }}' not found. Run Create Workflow Template test first."

    - name: "Set Workflow Template ID"
      ansible.builtin.set_fact:
        _wf_id: "{{ wf_lookup.json.results[0].id }}"
        _wf_name: "{{ wf_lookup.json.results[0].name }}"

    - name: "Launch Workflow Job Template"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/workflow_job_templates/{{ _wf_id }}/launch/"
        method: POST
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        body_format: json
        body: {}
        status_code: [201]
        return_content: true
      register: wf_launch

    - name: "Set Workflow Job ID"
      ansible.builtin.set_fact:
        _wf_job_id: "{{ wf_launch.json.id }}"
        _wf_job_url: "{{ wf_launch.json.url }}"

    - name: "Display workflow launch info"
      ansible.builtin.debug:
        msg: "Workflow Job {{ _wf_job_id }} launched for '{{ _wf_name }}'"

    - name: "Wait for Workflow Job to complete"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}{{ _wf_job_url }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      register: wf_status
      until: wf_status.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: "{{ (workflow_wait_timeout / workflow_wait_interval) | int }}"
      delay: "{{ workflow_wait_interval }}"

    - name: "Get Workflow Job nodes"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/workflow_jobs/{{ _wf_job_id }}/workflow_nodes/"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      register: wf_nodes

    - name: "Set report status"
      ansible.builtin.set_fact:
        _overall_status: "{{ 'PASSED' if wf_status.json.status == 'successful' else 'FAILED' }}"
        _status_icon: "{{ '✅' if wf_status.json.status == 'successful' else '❌' }}"

    - name: "Register test result"
      ansible.builtin.set_fact:
        smoke_test_results: >-
          {{ smoke_test_results | default({}) | combine({
            'launch_workflow_template': {
              'name': 'Launch Workflow Template',
              'status': _overall_status,
              'details': 'Workflow "' ~ _wf_name ~ '" launched successfully — Workflow Job ID: ' ~ _wf_job_id ~ ', completed in ' ~ (wf_status.json.elapsed | default('N/A') | string) ~ 's with status "' ~ wf_status.json.status ~ '"'
            }
          }) }}

    - name: "Display test result"
      ansible.builtin.debug:
        msg: >-
          Launch Workflow Template: {{ _overall_status }}
          | Workflow Job ID: {{ _wf_job_id }}
          | Status: {{ wf_status.json.status }}
          | Elapsed: {{ wf_status.json.elapsed | default('N/A') }}s

    - name: "Assert Workflow Job completed successfully"
      ansible.builtin.assert:
        that:
          - wf_status.json.status == 'successful'
        fail_msg: "Workflow Job {{ _wf_job_id }} ended with status '{{ wf_status.json.status }}' instead of 'successful'"
        success_msg: "Workflow Job {{ _wf_job_id }} completed successfully"
