# =============================================================================
# Create Credentials
# =============================================================================
# Objective: Verify the creation of Credentials of any type (Source Control,
#            custom Credential Types, Machine, Vault, etc.).
#
# Role: infra.aap_configuration.controller_credentials
# Variable: controller_credentials
#
# Prerequisites:
#   - Organization already created
#   - Credential Types (if custom) already created
#
# Expected output: All Credentials are correctly created and visible
#                  in the AAP 2.6 UI.
# =============================================================================
---
- name: "Create Credentials"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
  vars:
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"

  tasks:
    # -----------------------------------------------------------------
    # Obtain OAuth token (standalone mode only)
    # -----------------------------------------------------------------
    - name: "Obtain OAuth token (standalone mode)"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/tokens/"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: POST
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 201
      register: _authtoken_res
      no_log: true
      when: controller_oauthtoken is not defined

    - name: "Set OAuth token (standalone mode)"
      ansible.builtin.set_fact:
        controller_oauthtoken: "{{ _authtoken_res.json.token }}"
      when: _authtoken_res is not skipped
      no_log: true

    # -----------------------------------------------------------------
    # Load template data (standalone mode)
    # -----------------------------------------------------------------
    - name: "Find credential templates (standalone mode)"
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../templates/credentials/"
        patterns: "*.yml,*.yaml"
      register: _template_files
      when: smoke_credentials is not defined

    - name: "Load credential templates (standalone mode)"
      ansible.builtin.set_fact:
        smoke_credentials: >-
          {{ smoke_credentials | default([]) +
             ((lookup('template', item.path) | from_yaml).controller_credentials | default([])) }}
      loop: "{{ _template_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: _template_files is not skipped

    - name: "Set credential data"
      ansible.builtin.set_fact:
        _credentials: "{{ smoke_credentials | default([]) }}"

    - name: "Display credentials to create"
      ansible.builtin.debug:
        msg: "Creating {{ _credentials | length }} credential(s): {{ _credentials | map(attribute='name') | list }}"

    # -----------------------------------------------------------------
    # Create Credentials via infra.aap_configuration role
    # -----------------------------------------------------------------
    - name: "Create Credentials"
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_credentials
      vars:
        controller_credentials: "{{ _credentials }}"
        aap_token: "{{ controller_oauthtoken }}"

    # -----------------------------------------------------------------
    # Verify creation
    # -----------------------------------------------------------------
    - name: "Verify Credential creation"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/credentials/?search={{ item.name | urlencode }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      loop: "{{ _credentials }}"
      loop_control:
        label: "{{ item.name }}"
      register: cred_verify

    # -----------------------------------------------------------------
    # Report generation
    # -----------------------------------------------------------------
    - name: "Set report status"
      ansible.builtin.set_fact:
        _overall_status: "{{ 'PASSED' if cred_verify.results | rejectattr('failed', 'false') | list | length == 0 else 'FAILED' }}"
        _status_icon: "{{ '✅' if cred_verify.results | rejectattr('failed', 'false') | list | length == 0 else '❌' }}"

    - name: "Save report"
      ansible.builtin.copy:
        content: |
          # Create Credentials

          **Date:** {{ ansible_date_time.iso8601 }}
          **Result:** {{ _status_icon }} {{ _overall_status }}

          ## Resources Created

          {% for cred in _credentials %}
          ### Credential: {{ cred.name }}

          | Field | Value |
          |---|---|
          | **Resource Type** | Credential |
          | **Name** | {{ cred.name }} |
          | **Organization** | {{ cred.organization | default('N/A') }} |
          | **Credential Type** | {{ cred.credential_type }} |
          | **State** | {{ cred.state | default('present') }} |

          {% endfor %}
          ## Verification

          | Credential | Found on AAP |
          |---|---|
          {% for result in cred_verify.results %}
          | {{ result.item.name }} | {{ '✅ Yes' if result.json.count | int > 0 else '❌ No' }} |
          {% endfor %}
        dest: "{{ reports_dir }}/06_create_credentials_report.md"
        mode: '0644'

    - name: "Display test result"
      ansible.builtin.debug:
        msg: "Create Credentials: {{ _overall_status }}"

    - name: "Assert Credentials created"
      ansible.builtin.assert:
        that:
          - item.json.count | int > 0
        fail_msg: "Credential '{{ item.item.name }}' not found"
        success_msg: "Credential '{{ item.item.name }}' created successfully"
      loop: "{{ cred_verify.results }}"
      loop_control:
        label: "{{ item.item.name }}"
