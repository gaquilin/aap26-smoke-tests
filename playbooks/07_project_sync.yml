---
- name: "Project Synchronization"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
    - ../vars/main.yml
  vars:
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"

  tasks:
    - name: "Obtain OAuth token"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/tokens/"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: POST
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 201
      register: _authtoken_res
      no_log: true

    - name: "Set OAuth token"
      ansible.builtin.set_fact:
        controller_oauthtoken: "{{ _authtoken_res.json.token }}"
        controller_oauthtoken_url: "{{ _authtoken_res.json.url }}"
      no_log: true

    - name: "Find project templates (standalone mode)"
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../templates/projects/"
        patterns: "*.yml,*.yaml"
      register: _template_files
      when: smoke_projects is not defined

    - name: "Load project templates (standalone mode)"
      ansible.builtin.set_fact:
        smoke_projects: >-
          {{ smoke_projects | default([]) +
             ((lookup('template', item.path) | from_yaml).controller_projects | default([])) }}
      loop: "{{ _template_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: _template_files is not skipped

    - name: "Set project data"
      ansible.builtin.set_fact:
        _projects: "{{ smoke_projects | default([]) }}"

    - name: "Create and Sync Projects"
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_projects
      vars:
        controller_projects: "{{ _projects }}"
        aap_token: "{{ controller_oauthtoken }}"

    - name: "Verify Project sync status"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/projects/?search={{ item.name | urlencode }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      loop: "{{ _projects }}"
      loop_control:
        label: "{{ item.name }}"
      register: project_verify

    - name: "Check playbooks available in project"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/projects/{{ item.json.results[0].id }}/playbooks/"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      loop: "{{ project_verify.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: playbooks_check
      when: item.json.count | int > 0

    - name: "Set report status"
      ansible.builtin.set_fact:
        _overall_status: >-
          {{ 'PASSED' if (project_verify.results | rejectattr('failed', 'false') | list | length == 0)
             and (project_verify.results | map(attribute='json') | map(attribute='results') | flatten
                  | selectattr('status', 'equalto', 'successful') | list | length > 0)
             else 'FAILED' }}

    - name: "Register test result"
      ansible.builtin.set_fact:
        smoke_test_results: >-
          {{ smoke_test_results | default({}) | combine({
            'project_sync': {
              'name': 'Project Synchronization',
              'status': _overall_status,
              'details': 'Project "' ~ (_projects | map(attribute='name') | join('", "')) ~ '" has been created and synchronized successfully from SCM'
              if _overall_status == 'PASSED'
              else 'Failed to create or synchronize Project(s) from SCM'
            }
          }) }}

    - name: "Display test result"
      ansible.builtin.debug:
        msg: "Project Sync: {{ _overall_status }}"

    - name: "Assert Projects synced successfully"
      ansible.builtin.assert:
        that:
          - item.json.results | length > 0
          - item.json.results[0].status == 'successful'
        fail_msg: "Project '{{ item.item.name }}' sync failed or not found"
        success_msg: "Project '{{ item.item.name }}' synced successfully"
      loop: "{{ project_verify.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "Delete OAuth token"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ controller_oauthtoken_url }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: DELETE
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 204
      when: controller_oauthtoken_url is defined
