---
- name: "Create Inventory"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../credentials/credentials.yml
    - ../vars/main.yml
  vars:
    reports_dir: "{{ playbook_dir }}/../reports/{{ ansible_date_time.date }}"

  tasks:
    - name: "Obtain OAuth token"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/tokens/"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: POST
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 201
      register: _authtoken_res
      no_log: true

    - name: "Set OAuth token"
      ansible.builtin.set_fact:
        controller_oauthtoken: "{{ _authtoken_res.json.token }}"
        controller_oauthtoken_url: "{{ _authtoken_res.json.url }}"
      no_log: true

    - name: "Find inventory templates (standalone mode)"
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../templates/inventories/"
        patterns: "*.yml,*.yaml"
      register: _template_files
      when: smoke_inventories is not defined

    - name: "Load inventory templates (standalone mode)"
      ansible.builtin.set_fact:
        smoke_inventories: >-
          {{ smoke_inventories | default([]) +
             ((lookup('template', item.path) | from_yaml).controller_inventories | default([])) }}
        smoke_hosts: >-
          {{ smoke_hosts | default([]) +
             ((lookup('template', item.path) | from_yaml).controller_hosts | default([])) }}
      loop: "{{ _template_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: _template_files is not skipped

    - name: "Set inventory data"
      ansible.builtin.set_fact:
        _inventories: "{{ smoke_inventories | default([]) }}"
        _hosts: "{{ smoke_hosts | default([]) }}"

    - name: "Create Inventories"
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_inventories
      vars:
        controller_inventories: "{{ _inventories }}"
        aap_token: "{{ controller_oauthtoken }}"

    - name: "Create Hosts in Inventory"
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_hosts
      vars:
        controller_hosts: "{{ _hosts }}"
        aap_token: "{{ controller_oauthtoken }}"
      when: _hosts | length > 0

    - name: "Verify Inventory creation"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/inventories/?search={{ item.name | urlencode }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      loop: "{{ _inventories }}"
      loop_control:
        label: "{{ item.name }}"
      register: inv_verify

    - name: "Get Inventory ID"
      ansible.builtin.set_fact:
        _inventory_id: "{{ inv_verify.results[0].json.results[0].id }}"
      when: inv_verify.results[0].json.count | int > 0

    - name: "Verify Hosts in Inventory"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/inventories/{{ _inventory_id }}/hosts/"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      register: hosts_verify
      when: _inventory_id is defined

    - name: "Look up Machine credential by name"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/credentials/?name={{ smoke_inventory_credential | urlencode }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      register: machine_cred_lookup
      when:
        - _inventory_id is defined
        - smoke_inventory_credential | default('') | length > 0
      ignore_errors: true

    - name: "Run Ad Hoc ping command"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/inventories/{{ _inventory_id }}/ad_hoc_commands/"
        method: POST
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        body_format: json
        body:
          module_name: "ping"
          credential: "{{ machine_cred_lookup.json.results[0].id }}"
          limit: ""
          verbosity: 0
        status_code: [201]
        return_content: true
      register: adhoc_result
      when:
        - _inventory_id is defined
        - smoke_inventory_credential | default('') | length > 0
        - machine_cred_lookup is success
        - machine_cred_lookup.json.count | int > 0
      ignore_errors: true

    - name: "Wait for Ad Hoc command to complete"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}{{ adhoc_result.json.url }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: [200]
        return_content: true
      register: adhoc_status
      until: adhoc_status.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 30
      delay: 5
      when: adhoc_result is success and adhoc_result.json is defined
      ignore_errors: true

    - name: "Determine Ad Hoc ping status for report"
      ansible.builtin.set_fact:
        _adhoc_ping_status: >-
          {% if smoke_inventory_credential | default('') | length == 0 -%}
            skipped (no credential configured)
          {%- elif machine_cred_lookup is not defined or machine_cred_lookup is skipped -%}
            skipped (no credential configured)
          {%- elif machine_cred_lookup is failed or (machine_cred_lookup.json.count | default(0) | int == 0) -%}
            skipped (credential "{{ smoke_inventory_credential }}" not found)
          {%- elif adhoc_status is defined and adhoc_status is not skipped and adhoc_status.json is defined -%}
            {{ adhoc_status.json.status | default('unknown') }}
          {%- elif adhoc_result is defined and adhoc_result is failed -%}
            failed
          {%- else -%}
            not executed
          {%- endif %}

    - name: "Set report status"
      ansible.builtin.set_fact:
        _overall_status: "{{ 'PASSED' if inv_verify.results | rejectattr('failed', 'false') | list | length == 0 else 'FAILED' }}"
        _status_icon: "{{ '✅' if inv_verify.results | rejectattr('failed', 'false') | list | length == 0 else '❌' }}"

    - name: "Register test result"
      ansible.builtin.set_fact:
        smoke_test_results: >-
          {{ smoke_test_results | default({}) | combine({
            'create_inventory': {
              'name': 'Create Inventory',
              'status': _overall_status,
              'details': 'Inventory "' ~ (_inventories | map(attribute='name') | join('", "')) ~ '" created successfully with ' ~ (((hosts_verify.json.count | default(0)) if hosts_verify is defined and hosts_verify is success else 0) | string) ~ ' host(s) — Ad Hoc ping: ' ~ _adhoc_ping_status
              if _overall_status == 'PASSED'
              else 'Failed to create Inventory on Automation Controller'
            }
          }) }}

    - name: "Display test result"
      ansible.builtin.debug:
        msg: >-
          Create Inventory: {{ _overall_status }}
          | Hosts: {{ (hosts_verify.json.count | default(0)) if hosts_verify is defined and hosts_verify is success else 0 }}
          | Ad Hoc Ping: {{ _adhoc_ping_status }}

    - name: "Delete OAuth token"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ controller_oauthtoken_url }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: DELETE
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 204
      when: controller_oauthtoken_url is defined
