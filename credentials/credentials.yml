# =============================================================================
# AAP 2.6 Credentials - Smoke Regression Test
# =============================================================================
# Variables defined:
#   - aap_hostname:       AAP 2.6 Gateway FQDN (without https://)
#   - aap_username:       Gateway admin user
#   - aap_password:       Gateway admin password
#   - aap_validate_certs: SSL certificate validation (true/false)
#
#   - ah_hostname:        Private Automation Hub FQDN (same as gateway in AAP 2.6)
#   - ah_username:        Private Automation Hub user (same as gateway)
#
#   - scm_username:       Source Control (Git) user
#   - scm_password:       Source Control password/token
#
#   - registry_username: registry.redhat.io user
#   - registry_password: registry.redhat.io password
# =============================================================================
---
# --- AAP 2.6 Gateway Credentials ---
aap_hostname: "<AAP_HOSTNAME>"
aap_username: "<AAP_USERNAME>"
aap_password: "<AAP_PASSWORD>"
aap_validate_certs: false

# --- Private Automation Hub Credentials ---
ah_hostname: "{{ aap_hostname }}"
ah_username: "{{ aap_username }}"
ah_validate_certs: false

# --- Source Control Credentials ---
scm_username: "<SCM_USERNAME>"
scm_password: "<SCM_PASSWORD>"

# --- Red Hat Registry Credentials (for EE build) ---
registry_username: "<REGISTRY_USERNAME>"
registry_password: "<REGISTRY_PASSWORD>"

# --- Derived variables for infra.aap_configuration compatibility ---
# controller_* roles use the controller_ prefix
controller_hostname: "{{ aap_hostname }}"
controller_username: "{{ aap_username }}"
controller_password: "{{ aap_password }}"
controller_validate_certs: "{{ aap_validate_certs }}"
